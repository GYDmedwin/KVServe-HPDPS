[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "kvserve_v1"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pyzmq",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["kvserve_v1*"]

[tool.setuptools.package-data]
"kvserve_v1.compression.config.duo_config" = ["*.csv"]
